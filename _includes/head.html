<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.title and page.url != "/" %}{% assign full_title = page.title | append: " | " | append: site.title %}{% else %}{% assign full_title = site.title %}{% endif %}
<title>{{ full_title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta name="author" content="{{ site.author.name }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ full_title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ site.author.photo | absolute_url }}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "jobTitle": "{{ site.author.title }}",
  "affiliation": {"@type": "CollegeOrUniversity", "name": "{{ site.author.university }}"},
  "url": "{{ site.url }}",
  "image": "{{ site.author.photo | absolute_url }}",
  "sameAs": ["{{ site.author.scholar }}", "{{ site.author.github }}", "{{ site.author.linkedin }}"]
}
</script>
