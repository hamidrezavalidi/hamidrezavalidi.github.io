<header class="masthead">
  <div class="masthead-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="site-nav" aria-label="Main">
      <ul>
      {% for item in site.navigation %}
        {% if item.url == "cv" %}
          <li><a href="{{ site.author.cv | relative_url }}">{{ item.title }}</a></li>
        {% else %}
          {% assign is_current = false %}
          {% if page.url == item.url %}{% assign is_current = true %}{% endif %}
          <li><a href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endif %}
      {% endfor %}
      </ul>
    </nav>
  </div>
</header>
